name: CI

on:
  push:
    branches: [default, main, model, api, body, web, data, aditya]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e model -e explain -r api/requirements.txt
      - run: pytest model api explain
      - run: python docs/validate.py
      - name: Live API smoke test
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 0.25
          done
          python scripts/smoke.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for web app
        id: check
        run: |
          if [ -f web/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
      - name: Build web
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test
          npm run build

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -e model -e explain -r api/requirements.txt
      - run: npm --prefix web ci
      - run: npm run build:web
      - run: npm run test:desktop
      - run: npm run smoke:desktop
