[project]
name = "astrotwin-api"
version = "0.3.0"
description = "AstroTwin educational simulation API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.0",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
    "astrotwin-model==0.0.1",
    "astrotwin-explain==0.0.1",
]

[tool.uv]
package = false

[tool.uv.sources]
astrotwin-model = { path = "model" }
astrotwin-explain = { path = "explain" }

[tool.vercel]
entrypoint = "asgi:app"
